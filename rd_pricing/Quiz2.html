{% block title %}
    Quiz 2
{% endblock %}

{% block content %}

<div class="card card-body bg-light instructions">
    <div class="big">

        <div class="quiz-form">
            {{ formfield 'quiz_q2' }}
        </div>

        <button class="btn btn-primary submit-button">
            Submit Answer
        </button>

    </div>
</div>

{% endblock %}


{% block styles %}

<style>

    .big {
        font-size: large;
    }

    .big p,
    .big label {
        line-height: 1.5;
    }


    /* --------------------------------------------------------- */
    /* Question */
    /* --------------------------------------------------------- */

    .quiz-form .form-label,
    .quiz-form > label {
        display: block;
        padding: 18px;
        margin: 10px 0 20px 0;
        border: 1px solid #ccc;
        background-color: white;
        font-weight: 600;
    }


    /* --------------------------------------------------------- */
    /* Answer choices */
    /* --------------------------------------------------------- */

    .quiz-form .form-check {
        display: flex;
        align-items: center;

        min-height: 58px;
        padding: 10px 15px;
        margin: 8px 0;

        border: 2px solid transparent;
        border-radius: 6px;
    }

    .quiz-form .form-check:hover {
        background-color: #f7f7f7;
    }

    .quiz-form .form-check-input {
        width: 24px;
        height: 24px;
        margin-right: 15px;
        flex-shrink: 0;
    }

    .quiz-form .form-check-label {
        font-size: 1.15em;
        margin-left: 5px;
    }


    /* --------------------------------------------------------- */
    /* Submit button */
    /* --------------------------------------------------------- */

    .submit-button {
        margin-top: 20px;
    }

</style>

{% endblock %}
